<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryfe</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Hovering this wakes the island. It only ever gets the cursor while the
         island is hidden — at any other time the island covers it. -->
    <div id="wake"></div>

    <!-- data-mode is hidden | compact | open. The island's box is set from JS,
         animated; Rust is told the mode separately so it can resize the window
         and decide what is clickable. -->
    <div id="island" data-mode="compact">
      <div id="glow"></div>
      <!-- Positioned by JS, because the character moves between the header (in
           the compact island) and the gutter beside the content (when open). -->
      <canvas id="pet"></canvas>

      <!-- A div rather than a button: the tiles and the settings control inside
           it are buttons, and a button may not contain one. -->
      <div class="cap" id="cap" role="button" tabindex="0" aria-expanded="true" aria-controls="panel">
        <span class="capmain">
          <span class="capname">Pulsar</span>
          <span class="capsub" id="capsub">starting up…</span>
        </span>
        <span class="tiles" id="tiles"></span>
        <button class="iconbtn" id="capsettings" type="button" title="Settings" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
        <button class="caret" id="capcaret" type="button" title="Open" aria-label="Open or close the island">
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3.5 5.5 7 9l3.5-3.5" />
          </svg>
        </button>
      </div>

      <div class="panel" id="panel"></div>

      <!-- Drag to give the panel room of your own: the file list is the part
           that grows, because everything under it is a fixed height. -->
      <div id="grip" role="separator" aria-label="Drag to resize the island" title="Drag to resize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
          <circle cx="10" cy="10" r="1.15" />
          <circle cx="5.6" cy="10" r="1.15" />
          <circle cx="10" cy="5.6" r="1.15" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
