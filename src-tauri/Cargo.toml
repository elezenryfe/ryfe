[package]
name = "ryfe"
version = "0.1.0"
edition = "2021"
description = "Ryfe — a small machine at the top of your screen"
authors = ["elezen_ryfe"]
license = "MIT"

[lib]
name = "ryfe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Only the extended window style is touched directly; everything else goes
# through Tauri's own window API, which keeps this file small and portable.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
